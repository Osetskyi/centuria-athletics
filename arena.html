  <button type="button" data-open="players"><span>♟️</span><small>ГРАВЦІ</small></button>
  <button type="button" data-open="tactics"><span>⚽️</span><small>ТАКТИКА</small></button>
  <button type="button" data-open="squads"><span>🧑‍🧑‍🧒‍🧒</span><small>СКЛАДИ</small></button>
  <button type="button" data-open="chat"><span>✏️</span><small>ЧАТ</small></button>
  <button type="button" data-open="gatherings"><span>✅</span><small>ЗБОРИ</small></button>
  <button type="button" class="active" data-open="arena"><span>⚔️</span><small>АРЕНА</small></button>
</nav>
<script src="arena.js"></script>
<script>
(function(){
  const nav=document.getElementById("arenaBottomNav");
  if(!nav)return;
  const buttons=[...nav.querySelectorAll("button[data-open]")];
  let pressed=null,timer=0;
  function clearPressed(){if(timer){clearTimeout(timer);timer=0;}buttons.forEach(b=>b.classList.remove("nav-pressing"));pressed=null;}
  function press(btn){clearPressed();pressed=btn;btn.classList.add("nav-pressing");}
  function release(){if(!pressed)return;const target=pressed;timer=setTimeout(()=>{target.classList.remove("nav-pressing");if(pressed===target)pressed=null;timer=0;},85);}
  buttons.forEach(btn=>{
    btn.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse"&&e.button!==0)return;press(btn);},{passive:true});
    btn.addEventListener("pointerup",release,{passive:true});
    btn.addEventListener("pointercancel",clearPressed,{passive:true});
    btn.addEventListener("click",()=>{const target=btn.dataset.open;if(target==="arena")return;location.href=`index.html?open=${encodeURIComponent(target)}`;});
  });
  window.addEventListener("blur",clearPressed,{passive:true});
})();
</script></body></html>
